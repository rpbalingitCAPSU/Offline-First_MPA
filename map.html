<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map — MPA Monitor</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    /* Map page needs full-height layout */
    html, body { height: 100%; }
    .page-map .main-content { padding: 0; display: flex; flex-direction: column; height: calc(100vh - var(--navbar-height)); }
    #mapContainer { flex: 1; }
  </style>
</head>
<body class="page-map">

  <!-- ===== Navigation ===== -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-brand">
      <span class="app-logo" aria-hidden="true">🌊</span>
      <span class="app-name">MPA Monitor</span>
    </div>
    <ul class="navbar-links">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="survey.html"    class="nav-link">New Survey</a></li>
      <li><a href="map.html"       class="nav-link active" aria-current="page">Map</a></li>
      <li><a href="alerts.html"    class="nav-link">
        Alerts <span id="alertBadge" class="badge badge-danger hidden">0</span>
      </a></li>
      <li><a href="reports.html"   class="nav-link">Reports</a></li>
    </ul>
    <div class="navbar-user">
      <span id="navUsername" class="text-muted nav-username"></span>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
  </nav>

  <!-- ===== Page Content ===== -->
  <main class="main-content">
    <div id="mapContainer" aria-label="MPA sites map"></div>

    <!-- Map Legend -->
    <div class="map-legend card" aria-label="Map legend">
      <strong class="legend-title">Legend</strong>
      <ul class="legend-list">
        <li><span class="legend-dot legend-dot--normal"></span> MPA Site</li>
        <li><span class="legend-dot legend-dot--alert"></span> Active Alert</li>
        <li><span class="legend-dot legend-dot--critical"></span> Critical Alert</li>
      </ul>
    </div>
  </main>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(r => console.log('[SW] Ready', r.scope))
        .catch(e => console.error('[SW] Error', e));
    }
  </script>

  <script src="vendor/leaflet/leaflet.js"></script>
  <!-- sql.js WASM loader — must be a classic script so initSqlJs is global -->
  <script src="vendor/sqljs/sql-wasm.js"></script>
  <script type="module">
    import { requireAuth, currentUser, logout } from './js/auth.js';
    import { initDB } from './js/db.js';
    import { initMap, loadSiteMarkers } from './js/map.js';
    import { initSync } from './js/sync.js';
    import { updateAlertBadge } from './js/alerts.js';
    import { initWatsonxChat } from './js/watsonx.js';

    requireAuth();

    const user = currentUser();
    if (user) document.getElementById('navUsername').textContent = user.username;

    document.getElementById('logoutBtn').addEventListener('click', () => logout());

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      initSync();
      initMap('mapContainer');
      updateAlertBadge();
      initWatsonxChat({ currentUser });
    });
  </script>

</body>
</html>
